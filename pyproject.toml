[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

# Vendored as-is from facebookresearch/VideoPose3D (see file header) - left
# unreformatted so it stays easy to diff against upstream.
[tool.ruff.lint.per-file-ignores]
"single_camera/videopose3d_model.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
